# Known exceptions for the on-chain query runner.
#
# Every documented grpcurl command is run with values taken from the page. Most
# work. The ones here do not, and each says why, so the runner's output is what
# changed rather than the same list every week.
#
# Entries are diffed against the pages on every run: one whose method no longer
# exists is reported as an orphan rather than silently ignored, and a method
# added upstream is exercised with no entry at all.
#
# expect:
#   unfillable      the page cannot give a reader a usable value for some field
#   known-failure   the command runs but the chain rejects its arguments
#
# An entry is a statement that we know this cannot work as written. Where the
# reason is fixable it should be fixed instead of recorded.

# ---------------------------------------------------------------------------
# Values that only exist on a live chain. No static example can supply a
# transaction hash or raw transaction bytes, so these are inherent rather than
# oversights. The honest fix is prose naming where the value comes from.
# ---------------------------------------------------------------------------

[queries."cosmos.tx.v1beta1.Service/GetTx"]
expect = "unfillable"
note = "needs a transaction hash, which only exists after broadcasting one"

[queries."cosmos.tx.v1beta1.Service/GetTxsEvent"]
expect = "unfillable"
note = "needs a CometBFT event query; the syntax is not documented on this page"

[queries."cosmos.tx.v1beta1.Service/TxEncode"]
expect = "unfillable"
note = "timeout_timestamp has no stated form on this page"

[queries."cosmos.tx.v1beta1.Service/BroadcastTx"]
expect = "known-failure"
note = "needs signed transaction bytes from a previous step"

[queries."cosmos.tx.v1beta1.Service/Simulate"]
expect = "known-failure"
note = "needs transaction bytes"

[queries."cosmos.tx.v1beta1.Service/TxDecode"]
expect = "known-failure"
note = "needs transaction bytes"

[queries."cosmos.tx.v1beta1.Service/TxDecodeAmino"]
expect = "known-failure"
note = "needs amino-encoded transaction bytes"

[queries."cosmos.tx.v1beta1.Service/TxEncodeAmino"]
expect = "known-failure"
note = "needs an amino JSON document"

[queries."cosmos.evidence.v1beta1.Query/Evidence"]
expect = "known-failure"
note = "needs a hex evidence hash, obtainable only from a submitted evidence transaction"

[queries."cosmos.base.tendermint.v1beta1.Service/ABCIQuery"]
expect = "known-failure"
note = "needs an ABCI store path; the page does not enumerate valid paths"

# ---------------------------------------------------------------------------
# Upstream leaves the field undocumented, so the page has nothing to pass on.
# These are worth raising with cosmos-sdk rather than papering over here.
# ---------------------------------------------------------------------------

[queries."cosmos.auth.v1beta1.Query/AddressBytesToString"]
expect = "known-failure"
note = "address_bytes is base64 of raw address bytes; upstream documents no example and an empty value is rejected"

[queries."cosmos.auth.v1beta1.Query/AddressStringToBytes"]
expect = "known-failure"
note = "address_string carries no scalar annotation upstream, so nothing marks it as bech32"

[queries."cosmos.authz.v1beta1.Query/Grants"]
expect = "unfillable"
note = "msg_type_url has no stated form; upstream's comment does not give an example"

[queries."cosmos.upgrade.v1beta1.Query/AppliedPlan"]
expect = "unfillable"
note = "needs the name of a plan that has been applied; no query lists them"

[queries."cosmos.upgrade.v1beta1.Query/ModuleVersions"]
expect = "unfillable"
note = "module_name is optional and undocumented; omitting it returns every module"

[queries."cosmos.base.reflection.v1beta1.ReflectionService/ListImplementations"]
expect = "unfillable"
note = "needs an interface name from ListAllInterfaces; the page does not cross-reference it"

# ---------------------------------------------------------------------------
# Not a node API. The service is implemented by an out-of-process streaming
# plugin that the node dials as a client, so no node serves it on 9090.
# ---------------------------------------------------------------------------

[queries."cosmos.store.streaming.abci.ABCIListenerService/ListenCommit"]
expect = "unfillable"
note = "plugin interface, not served by a node; the example cannot work anywhere"

[queries."cosmos.store.streaming.abci.ABCIListenerService/ListenFinalizeBlock"]
expect = "unfillable"
note = "plugin interface, not served by a node; the example cannot work anywhere"
